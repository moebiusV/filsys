name: macos

# Runs on a native runner (there is no macos-vm action).  Uses FUSE-T (fuse2,
# kext-free) rather than macFUSE: macFUSE's fuse3 API is not Linux/BSD fuse3
# (getattr/readdir take struct fuse_darwin_attr, statfs takes struct statfs),
# and its kext cannot be loaded headlessly.  FUSE-T is a drop-in macfuse-
# compatible libfuse 2.x that mounts through a local NFS server (no kext).

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: macOS — fuse2 (FUSE-T, kext-free)
        run: |
          eval "$(brew shellenv)"
          brew install pkg-config
          brew install macos-fuse-t/homebrew-cask/fuse-t
          # FUSE-T ships no .pc file and installs its header in a fuse/ subdir
          # off the default path; locate fuse.h and the libfuse dylib and point
          # configure at them.
          FUSE_H="$(find /usr/local /opt/homebrew -name fuse.h 2>/dev/null | head -1)"
          FUSE_LIB="$(find /usr/local /opt/homebrew -name 'libfuse*.dylib' 2>/dev/null | head -1)"
          [ -n "$FUSE_H" ]   || { echo "FUSE-T fuse.h not found"; exit 1; }
          [ -n "$FUSE_LIB" ] || { echo "FUSE-T libfuse not found"; exit 1; }
          export CPPFLAGS="-I$(dirname "$FUSE_H")"
          export LDFLAGS="-L$(dirname "$FUSE_LIB")"
          ./configure --with-fuse=fuse2
          make
          make check; rc=$?; cat test.sh.log test-suite.log 2>/dev/null; exit $rc
          curl -L -o rp06-0.disk.gz https://github.com/pcollinson/unixv7-extras/raw/main/bootstrap/rp06-0.disk.gz
          gunzip rp06-0.disk.gz
          ./configure --with-fuse=fuse2 --enable-image-tests
          make
          make check; rc=$?; cat test.sh.log test-suite.log 2>/dev/null; exit $rc
