name: macos

# Runs on a native runner (there is no macos-vm action).  Uses macFUSE (fuse3),
# the documented macOS backend, compiled against the fuseops_macos.c adapter
# that bridges macFUSE's darwin attr types (struct fuse_darwin_attr / struct
# statfs) onto the shared FUSE-free core.  The kext cannot be loaded headlessly
# on a runner (it needs a System Settings approval + reboot), so the job proves
# the build and the FUSE-free core; a live mount is a local-only step.

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: macOS — fuse3 (macFUSE)
        run: |
          eval "$(brew shellenv)"
          brew install pkg-config
          brew install --cask macfuse
          ./configure --with-fuse=fuse3
          make
          # `make check` here runs only test_matrix (no --enable-image-tests, so
          # test.sh is not in TESTS and test.sh.log is never written).  The
          # default `bash -e` shell would let the trailing `cat test.sh.log ...`
          # (a missing file) flip the step to exit 1 despite PASS, so drop `-e`
          # first and let `exit $rc` carry make's real status -- same idiom the
          # bsd.yml jobs use.
          set +e
          make check
          rc=$?
          cat test.sh.log test-suite.log 2>/dev/null
          exit $rc
