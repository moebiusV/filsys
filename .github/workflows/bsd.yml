name: bsd

# Build and test on real BSD kernels via the vmactions -vm actions (a
# QEMU-accelerated VM per job).  Two layers:
#
#   - the existing jobs (FreeBSD/OpenBSD/NetBSD) download a real V7 image,
#     configure with --enable-image-tests and run gmake check once (test_matrix
#     + test.sh), then run the handle-fidelity conformance probe.
#   - the roadmap jobs (HardenedBSD/DragonFly/MidnightBSD) do the T1 gate
#     (configure + gmake + gmake check, no image tests yet) plus the
#     conformance probe -- that probe is the Phase 1 go/no-go that measures
#     whether each platform's FUSE delivers a stable fi->fh and fires release
#     at close, the assumption the 1.9.3 deferred-free lifecycle rests on.
#
# The BSDs use GNU make (gmake) for autotools-generated Makefiles.  FUSE is
# fuse3 on FreeBSD (fusefs-libs3) and NetBSD >= 10 (librefuse), fuse2 on
# OpenBSD (base libfuse, 2.6-era).  The three roadmap BSDs are FreeBSD-derived
# and expected to be fuse3.

on:
  push:
  pull_request:

jobs:
  freebsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: FreeBSD — fuse3 (fusefs-libs3)
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg install -y gmake pkgconf fusefs-libs3 curl
            kldload fusefs
          run: |
            curl -L -o rp06-0.disk.gz https://github.com/pcollinson/unixv7-extras/raw/main/bootstrap/rp06-0.disk.gz
            gunzip -f rp06-0.disk.gz
            MAKE=gmake ./configure --with-fuse=fuse3 --enable-image-tests
            gmake
            set +e
            gmake check
            rc=$?
            cat test.sh.log test-suite.log 2>/dev/null
            echo "=== handle-fidelity conformance probe ==="
            cc -D_FILE_OFFSET_BITS=64 conformance/fuse-conformance.c $(pkg-config --cflags --libs fuse3) -o conformance/fuse-conformance && \
              cc -D_FILE_OFFSET_BITS=64 conformance/conformance-client.c -o conformance/conformance-client && \
              sh conformance/run.sh
            exit $rc

  openbsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: OpenBSD — fuse2 (base libfuse)
        uses: vmactions/openbsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg_add gmake curl
            pkg_add pkgconf || pkg_add pkg-config
            pkg_add coreutils || true
          run: |
            curl -L -o rp06-0.disk.gz https://github.com/pcollinson/unixv7-extras/raw/main/bootstrap/rp06-0.disk.gz
            gunzip -f rp06-0.disk.gz
            MAKE=gmake ./configure --with-fuse=fuse2 --enable-image-tests
            gmake
            set +e
            gmake check
            rc=$?
            cat test.sh.log test-suite.log 2>/dev/null
            sh ./test-openbsd-release.sh
            echo "=== handle-fidelity conformance probe (fuse2) ==="
            cc -D_FILE_OFFSET_BITS=64 conformance/fuse-conformance-fuse2.c $(pkg-config --cflags --libs fuse) -o conformance/fuse-conformance-fuse2 && \
              cc -D_FILE_OFFSET_BITS=64 conformance/conformance-client.c -o conformance/conformance-client && \
              sh conformance/run.sh ./fuse-conformance-fuse2 fuse2
            exit $rc

  netbsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: NetBSD — fuse3 (librefuse)
        uses: vmactions/netbsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg_add gmake curl
            pkg_add pkgconf || pkg_add pkg-config
            pkg_add coreutils || true
          run: |
            curl -L -o rp06-0.disk.gz https://github.com/pcollinson/unixv7-extras/raw/main/bootstrap/rp06-0.disk.gz
            gunzip -f rp06-0.disk.gz
            MAKE=gmake ./configure --with-fuse=fuse3 --enable-image-tests
            gmake
            set +e
            gmake check
            rc=$?
            cat test.sh.log test-suite.log 2>/dev/null
            echo "=== handle-fidelity conformance probe ==="
            cc -D_FILE_OFFSET_BITS=64 conformance/fuse-conformance.c $(pkg-config --cflags --libs fuse3) -o conformance/fuse-conformance && \
              cc -D_FILE_OFFSET_BITS=64 conformance/conformance-client.c -o conformance/conformance-client && \
              sh conformance/run.sh
            exit $rc

  hardenedbsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HardenedBSD — fuse3
        uses: vmactions/hardenedbsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg install -y gmake pkgconf fusefs-libs3 curl
            kldload fusefs
          run: |
            MAKE=gmake ./configure --with-fuse=fuse3
            gmake
            set +e
            gmake check
            rc=$?
            cat test-suite.log 2>/dev/null
            echo "=== handle-fidelity conformance probe ==="
            cc -D_FILE_OFFSET_BITS=64 conformance/fuse-conformance.c $(pkg-config --cflags --libs fuse3) -o conformance/fuse-conformance && \
              cc -D_FILE_OFFSET_BITS=64 conformance/conformance-client.c -o conformance/conformance-client && \
              sh conformance/run.sh
            exit $rc

  dragonflybsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: DragonFly BSD — fuse3
        uses: vmactions/dragonflybsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg install -y gmake pkgconf fusefs-libs curl
            kldload fuse || true
          run: |
            MAKE=gmake ./configure --with-fuse=fuse3
            gmake
            set +e
            gmake check
            rc=$?
            cat test-suite.log 2>/dev/null
            echo "=== handle-fidelity conformance probe ==="
            cc -D_FILE_OFFSET_BITS=64 conformance/fuse-conformance.c $(pkg-config --cflags --libs fuse3) -o conformance/fuse-conformance && \
              cc -D_FILE_OFFSET_BITS=64 conformance/conformance-client.c -o conformance/conformance-client && \
              sh conformance/run.sh
            exit $rc

  midnightbsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: MidnightBSD — fuse3
        uses: vmactions/midnightbsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg install -y gmake pkgconf fusefs-libs3 curl
            kldload fusefs
          run: |
            MAKE=gmake ./configure --with-fuse=fuse3
            gmake
            set +e
            gmake check
            rc=$?
            cat test-suite.log 2>/dev/null
            echo "=== handle-fidelity conformance probe ==="
            cc -D_FILE_OFFSET_BITS=64 conformance/fuse-conformance.c $(pkg-config --cflags --libs fuse3) -o conformance/fuse-conformance && \
              cc -D_FILE_OFFSET_BITS=64 conformance/conformance-client.c -o conformance/conformance-client && \
              sh conformance/run.sh
            exit $rc
